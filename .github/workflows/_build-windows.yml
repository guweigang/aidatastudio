name: Build AIData Studio Windows

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      publish_github_release:
        required: true
        type: boolean

permissions:
  contents: write

env:
  PYTHONUTF8: 1
  # Release builds must keep the pinned compiler and standard library together.
  V_MACOS_V3_NO_FALLBACK: 1
  TAURI_CLI_VERSION: 2.11.4
  SOURCE_DIR: source
  VJSX_DIR: vjsx
  VDUCKDB_DIR: vduckdb
  VCLICKHOUSE_DIR: vclickhouse
  MONGO_DIR: mongo
  VMARKDOWN_DIR: vmarkdown
  QUICKJS_DIR: quickjs
  CNB_SOURCE_REPO: ${{ vars.CNB_SOURCE_REPO || 'https://cnb.cool/bullsoft/vtable.git' }}
  VJSX_REPO: ${{ vars.VJSX_REPO || 'https://github.com/guweigang/vjsx.git' }}
  VDUCKDB_REPO: ${{ vars.VDUCKDB_REPO || 'https://github.com/guweigang/vduckdb.git' }}
  VDUCKDB_REF: ${{ vars.VDUCKDB_REF || 'main' }}
  VCLICKHOUSE_REPO: ${{ vars.VCLICKHOUSE_REPO || 'https://github.com/guweigang/vclickhouse.git' }}
  VCLICKHOUSE_REF: ${{ vars.VCLICKHOUSE_REF || 'main' }}
  MONGO_REPO: ${{ vars.MONGO_REPO || 'https://github.com/guweigang/mongo.git' }}
  MONGO_REF: ${{ vars.MONGO_REF || 'main' }}
  VMARKDOWN_REPO: ${{ vars.VMARKDOWN_REPO || 'https://github.com/guweigang/vmarkdown.git' }}
  VMARKDOWN_REF: ${{ vars.VMARKDOWN_REF || 'master' }}
  DUCKDB_VERSION: ${{ vars.DUCKDB_VERSION || 'v1.5.5' }}
  VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}\.cache\vcpkg-binary-cache
  VTABLE_SIDECAR_V_CC: ${{ vars.VTABLE_SIDECAR_V_CC || 'clang' }}
  VTABLE_SIDECAR_V_FLAGS: ${{ vars.VTABLE_SIDECAR_V_FLAGS || '-show-c-output -d build_quickjs -d use_openssl' }}
  VTABLE_WINDOWS_SIDECAR_V_FLAGS: ${{ vars.VTABLE_WINDOWS_SIDECAR_V_FLAGS || '-cc msvc -show-c-output -d link_quickjs' }}

jobs:
  windows:
    name: Windows package (x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Prepare CNB authentication
        shell: pwsh
        env:
          CNB_ACCESS_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          if ($env:CNB_ACCESS_TOKEN) {
            git config --global url."https://cnb:$env:CNB_ACCESS_TOKEN@cnb.cool/".insteadOf "https://cnb.cool/"
          }

      - name: Clone source from CNB
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/ci/windows/clone-source.ps1" `
            -Repository "$env:CNB_SOURCE_REPO" `
            -SourceRef "${{ inputs.source_ref }}" `
            -Destination "$env:SOURCE_DIR"

      - name: Clone pinned vjsx
        shell: bash
        run: sh scripts/ci/clone-vjsx.sh

      - name: Clone V modules
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:VDUCKDB_REF" "$env:VDUCKDB_REPO" "$env:VDUCKDB_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch "$env:VCLICKHOUSE_REF" "$env:VCLICKHOUSE_REPO" "$env:VCLICKHOUSE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch "$env:MONGO_REF" "$env:MONGO_REPO" "$env:MONGO_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch "$env:VMARKDOWN_REF" "$env:VMARKDOWN_REPO" "$env:VMARKDOWN_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure vjsx managed QuickJS source
        shell: bash
        run: |
          set -euo pipefail
          quickjs_dir="$(pwd)/${QUICKJS_DIR}"
          quickjs_path="$(QUICKJS_DIR="${quickjs_dir}" "./${VJSX_DIR}/scripts/ensure-quickjs.sh")"
          if command -v cygpath >/dev/null 2>&1; then
            quickjs_path="$(cygpath -w "$quickjs_path")"
          fi
          echo "VJS_QUICKJS_PATH=${quickjs_path}" >> "${GITHUB_ENV}"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build QuickJS NG on Windows
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\build-quickjs.ps1"'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify commit-ref clone preserves embedded bytes
        shell: pwsh
        run: python scripts/ci/windows/test-clone-source.py --clone-script scripts/ci/windows/clone-source.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/desktop/package-lock.json

      - name: Cache Windows vcpkg binary packages
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vcpkg-binary-cache
          key: windows-vcpkg-x64-windows-msvc-v1-${{ hashFiles('.github/workflows/_build-windows.yml', 'scripts/ci/windows/*.ps1') }}
          restore-keys: |
            windows-vcpkg-x64-windows-msvc-v1-

      - name: Cache Windows Cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-tools-v2-tauri-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('source/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-tools-v2-tauri-${{ env.TAURI_CLI_VERSION }}-

      - name: Cache Windows Tauri target
        id: tauri_cache
        uses: actions/cache/restore@v4
        with:
          path: source/desktop/src-tauri/target
          key: windows-tauri-target-v1-${{ hashFiles('source/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-tauri-target-v1-

      - name: Setup V on Windows
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\setup-v.ps1"'

      - name: Install DuckDB native library
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\install-duckdb.ps1"'

      - name: Install Windows native dependencies
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\install-native-deps.ps1"'

      - name: Save completed native dependency packages
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/vcpkg-binary-cache
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

      - name: Bind V to the selected native SDK and smoke OpenSSL
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\configure-v-native-sdk.ps1"'

      - name: Build and stage native attachment OCR
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\stage-attachment-ocr.ps1"'

      - name: Install desktop dependencies
        working-directory: source/desktop
        shell: pwsh
        run: npm ci

      - name: Build Rust SQL parser
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\build-rust-sql-parser.ps1"'

      - name: Build vjsx runtime
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\build-vjsx-runtime.ps1"'

      - name: Prepare Windows sidecar
        working-directory: source
        shell: pwsh
        env:
          VTABLE_VJSX_PATH: ${{ github.workspace }}\${{ env.VJSX_DIR }}
          VTABLE_SIDECAR_V_FLAGS: ${{ env.VTABLE_WINDOWS_SIDECAR_V_FLAGS }}
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\build-sidecar.ps1"'

      - name: Check desktop and Tauri build inputs
        working-directory: source
        shell: pwsh
        run: |
          npm --prefix desktop run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned prebuilt Tauri CLI
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\install-tauri-cli.ps1"'

      - name: Prepare audited NSIS upgrade template
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\prepare-nsis-template.ps1"'

      - name: Configure Tauri updater
        if: inputs.publish_github_release
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY_VAR: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_PUBLIC_KEY_SECRET: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT || 'https://update.aidata.studio/latest.json' }}
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\configure-updater.ps1"'

      - name: Stage sidecar runtime DLLs
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\stage-runtime.ps1"'

      - name: Inspect Windows sidecar dependencies
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\inspect-dependencies.ps1"'

      - name: Doctor Windows sidecar runtime
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\doctor-runtime.ps1"'

      - name: Smoke Windows notebook runtime
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\smoke-notebook.ps1"'

      - name: Prepare Windows Tauri icon
        working-directory: source
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\prepare-icon.ps1"'

      - name: Build Windows package
        working-directory: source
        shell: pwsh
        env:
          VTABLE_VJSX_PATH: ${{ github.workspace }}\${{ env.VJSX_DIR }}
          VTABLE_SIDECAR_V_FLAGS: ${{ env.VTABLE_WINDOWS_SIDECAR_V_FLAGS }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\build-package.ps1"'

      - name: Save completed Windows application build cache
        if: steps.tauri_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/desktop/src-tauri/target
          key: ${{ steps.tauri_cache.outputs.cache-primary-key }}

      - name: Retain Windows package candidate before installation checks
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\save-package-candidate.ps1"'

      - name: Upload Windows package candidate
        uses: actions/upload-artifact@v4
        with:
          name: aidatastudio-windows-candidate-${{ github.run_id }}
          path: dist/windows-candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify NSIS upgrade preserves app data
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\smoke-installer-upgrade.ps1"'

      - name: Verify installed OCR resources and native dependencies
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\verify-installed-ocr.ps1"'

      - name: Collect Windows artifacts
        id: windows_meta
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\collect-artifacts.ps1"'

      - name: Prune stale Windows release assets
        if: inputs.publish_github_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.windows_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.windows_meta.outputs.tag }}
        run: '& "$env:GITHUB_WORKSPACE\scripts\ci\windows\prune-release-assets.ps1"'

      - name: Normalize artifact source ref
        id: artifact_ref
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node "$env:GITHUB_WORKSPACE\scripts\ci\normalize-artifact-ref.mjs"

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidatastudio-windows-${{ steps.artifact_ref.outputs.value }}-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: inputs.publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.windows_meta.outputs.tag }}
          name: AIData Studio ${{ steps.windows_meta.outputs.version }}
          files: |
            dist/windows/*
          fail_on_unmatched_files: true
