name: Build AIData Studio

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "CNB source branch, tag, or commit to build"
        required: true
        default: "main"
      platform:
        description: "Platform to build"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - all
      release_mode:
        description: "macOS release mode"
        required: true
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - signed
          - signed-skip-stapling
      target_mode:
        description: "macOS target mode"
        required: true
        default: "apple-silicon"
        type: choice
        options:
          - host
          - apple-silicon
          - intel
          - both
          - universal
      publish_github_release:
        description: "Publish artifacts to a GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aidatastudio-build-${{ github.event.inputs.source_ref }}-${{ github.event.inputs.platform }}-${{ github.event.inputs.target_mode }}
  cancel-in-progress: false

jobs:
  macos:
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    uses: ./.github/workflows/_build-macos.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      release_mode: ${{ inputs.release_mode }}
      target_mode: ${{ inputs.target_mode }}
      publish_github_release: ${{ inputs.publish_github_release }}
    secrets: inherit

  windows:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    uses: ./.github/workflows/_build-windows.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      publish_github_release: ${{ inputs.publish_github_release }}
    secrets: inherit

  update-manifest:
    if: always() && inputs.publish_github_release
    needs:
      - macos
      - windows
    uses: ./.github/workflows/_publish-manifest.yml
    secrets: inherit

  upload-r2:
    if: inputs.publish_github_release && needs.update-manifest.result == 'success'
    needs:
      - update-manifest
    uses: ./.github/workflows/_upload-r2.yml
    with:
      version: ${{ needs.update-manifest.outputs.version }}
      tag: ${{ needs.update-manifest.outputs.tag }}
    secrets: inherit
