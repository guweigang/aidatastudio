name: Build AIData Studio macOS

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_mode:
        required: true
        type: string
      target_mode:
        required: true
        type: string
      publish_github_release:
        required: true
        type: boolean

permissions:
  contents: write

env:
  TAURI_CLI_VERSION: 2.11.4
  SOURCE_DIR: source
  VJSX_DIR: vjsx
  VDUCKDB_DIR: vduckdb
  VCLICKHOUSE_DIR: vclickhouse
  MONGO_DIR: mongo
  VMARKDOWN_DIR: vmarkdown
  QUICKJS_DIR: quickjs
  CNB_SOURCE_REPO: ${{ vars.CNB_SOURCE_REPO || 'https://cnb.cool/bullsoft/vtable.git' }}
  VJSX_REPO: ${{ vars.VJSX_REPO || 'https://github.com/guweigang/vjsx.git' }}
  VDUCKDB_REPO: ${{ vars.VDUCKDB_REPO || 'https://github.com/guweigang/vduckdb.git' }}
  VDUCKDB_REF: ${{ vars.VDUCKDB_REF || 'main' }}
  VCLICKHOUSE_REPO: ${{ vars.VCLICKHOUSE_REPO || 'https://github.com/guweigang/vclickhouse.git' }}
  VCLICKHOUSE_REF: ${{ vars.VCLICKHOUSE_REF || 'main' }}
  MONGO_REPO: ${{ vars.MONGO_REPO || 'https://github.com/guweigang/mongo.git' }}
  MONGO_REF: ${{ vars.MONGO_REF || 'main' }}
  VMARKDOWN_REPO: ${{ vars.VMARKDOWN_REPO || 'https://github.com/guweigang/vmarkdown.git' }}
  VMARKDOWN_REF: ${{ vars.VMARKDOWN_REF || 'master' }}
  DUCKDB_VERSION: ${{ vars.DUCKDB_VERSION || 'v1.5.5' }}
  VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}\.cache\vcpkg-binary-cache
  VTABLE_SIDECAR_V_CC: ${{ vars.VTABLE_SIDECAR_V_CC || 'clang' }}
  VTABLE_SIDECAR_V_FLAGS: ${{ vars.VTABLE_SIDECAR_V_FLAGS || '-show-c-output -d build_quickjs -d use_openssl' }}
  VTABLE_WINDOWS_SIDECAR_V_FLAGS: ${{ vars.VTABLE_WINDOWS_SIDECAR_V_FLAGS || '-cc msvc -show-c-output -d link_quickjs' }}

jobs:
  macos:
    name: macOS DMG (${{ matrix.target_mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target_mode == 'both' && '[{"target_mode":"apple-silicon","runner":"macos-26"},{"target_mode":"intel","runner":"macos-26-intel"}]' || inputs.target_mode == 'intel' && '[{"target_mode":"intel","runner":"macos-26-intel"}]' || inputs.target_mode == 'universal' && '[{"target_mode":"universal","runner":"macos-26"}]' || inputs.target_mode == 'host' && '[{"target_mode":"host","runner":"macos-26"}]' || '[{"target_mode":"apple-silicon","runner":"macos-26"}]') }}

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Verify Xcode and macOS SDK
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/verify-xcode.sh"

      - name: Prepare CNB authentication
        env:
          CNB_ACCESS_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          set -eu
          if [ -n "${CNB_ACCESS_TOKEN}" ]; then
            git config --global url."https://cnb:${CNB_ACCESS_TOKEN}@cnb.cool/".insteadOf "https://cnb.cool/"
          fi

      - name: Clone source from CNB
        run: |
          set -eu
          git clone --depth 1 --branch "${{ inputs.source_ref }}" "${CNB_SOURCE_REPO}" "${SOURCE_DIR}" || {
            git clone "${CNB_SOURCE_REPO}" "${SOURCE_DIR}"
            cd "${SOURCE_DIR}"
            git checkout "${{ inputs.source_ref }}"
          }

      - name: Clone latest vjsx
        run: |
          set -eu
          sh scripts/ci/clone-vjsx.sh

      - name: Clone V modules
        run: |
          set -eu
          git clone --depth 1 --branch "${VDUCKDB_REF}" "${VDUCKDB_REPO}" "${VDUCKDB_DIR}"
          git clone --depth 1 --branch "${VCLICKHOUSE_REF}" "${VCLICKHOUSE_REPO}" "${VCLICKHOUSE_DIR}"
          git clone --depth 1 --branch "${MONGO_REF}" "${MONGO_REPO}" "${MONGO_DIR}"
          git clone --depth 1 --branch "${VMARKDOWN_REF}" "${VMARKDOWN_REPO}" "${VMARKDOWN_DIR}"
          mkdir -p "${HOME}/.vmodules/rodabt"
          ln -s "${GITHUB_WORKSPACE}/${VDUCKDB_DIR}" "${HOME}/.vmodules/rodabt/vduckdb"
          ln -s "${GITHUB_WORKSPACE}/${MONGO_DIR}/src" "${HOME}/.vmodules/mongo"
          ln -s "${GITHUB_WORKSPACE}/${VMARKDOWN_DIR}" "${HOME}/.vmodules/vmarkdown"

      - name: Install DuckDB native library
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/install-duckdb.sh"

      - name: Ensure vjsx managed QuickJS source
        run: |
          set -eu
          quickjs_path="$(QUICKJS_DIR="${GITHUB_WORKSPACE}/${QUICKJS_DIR}" "${GITHUB_WORKSPACE}/${VJSX_DIR}/scripts/ensure-quickjs.sh")"
          echo "VJS_QUICKJS_PATH=${quickjs_path}" >> "${GITHUB_ENV}"

      - name: Install system dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/install-native-deps.sh"

      - name: Install V
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/install-v.sh"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache macOS Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/desktop/src-tauri/target
          key: macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target_mode }}-cargo-${{ hashFiles('source/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target_mode }}-cargo-
            macos-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: source/desktop
        run: npm ci

      - name: Install Tauri CLI
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/install-tauri.sh"

      - name: Configure Tauri updater
        if: inputs.publish_github_release
        env:
          TAURI_UPDATER_PUBLIC_KEY_VAR: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_PUBLIC_KEY_SECRET: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT || 'https://update.aidata.studio/latest.json' }}
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/configure-updater.sh"

      - name: Check desktop and Tauri build inputs
        working-directory: source
        env:
          VTABLE_VJSX_PATH: ${{ github.workspace }}/${{ env.VJSX_DIR }}
          VTABLE_VCLICKHOUSE_PATH: ${{ github.workspace }}/${{ env.VCLICKHOUSE_DIR }}
          VFLAGS: "-cc clang"
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/check-build-inputs.sh"

      - name: Build macOS release
        working-directory: source
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          TARGET_MODE: ${{ matrix.target_mode }}
          VTABLE_VJSX_PATH: ${{ github.workspace }}/${{ env.VJSX_DIR }}
          VTABLE_VCLICKHOUSE_PATH: ${{ github.workspace }}/${{ env.VCLICKHOUSE_DIR }}
          VFLAGS: "-cc clang"
          OUTPUT_DIR: ${{ github.workspace }}/dist/macos
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/build-release.sh"

      - name: Read release metadata
        id: release_meta
        run: sh "$GITHUB_WORKSPACE/scripts/ci/macos/read-release-metadata.sh"

      - name: Normalize artifact source ref
        id: artifact_ref
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node "$GITHUB_WORKSPACE/scripts/ci/normalize-artifact-ref.mjs"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidatastudio-macos-${{ steps.artifact_ref.outputs.value }}-${{ inputs.release_mode }}-${{ steps.release_meta.outputs.arch }}
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: inputs.publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: AIData Studio ${{ steps.release_meta.outputs.version }}
          body_path: dist/macos/RELEASE_NOTES.md
          files: |
            dist/macos/${{ steps.release_meta.outputs.artifact }}
            dist/macos/*.app.tar.gz
            dist/macos/*.app.tar.gz.sig
            dist/macos/sha256sums.txt
            dist/macos/release.json
          fail_on_unmatched_files: true
