name: Build AIData Studio Linux

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "CNB source branch, tag, or commit to build"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: aidatastudio-linux-${{ github.event.inputs.source_ref }}
  cancel-in-progress: false

env:
  V_MACOS_V3_NO_FALLBACK: 1
  TAURI_CLI_VERSION: 2.11.4
  SOURCE_DIR: source
  VJSX_DIR: vjsx
  VDUCKDB_DIR: vduckdb
  VCLICKHOUSE_DIR: vclickhouse
  MONGO_DIR: mongo
  VMARKDOWN_DIR: vmarkdown
  QUICKJS_DIR: quickjs
  CNB_SOURCE_REPO: ${{ vars.CNB_SOURCE_REPO || 'https://cnb.cool/bullsoft/vtable.git' }}
  VJSX_REPO: ${{ vars.VJSX_REPO || 'https://github.com/guweigang/vjsx.git' }}
  VDUCKDB_REPO: ${{ vars.VDUCKDB_REPO || 'https://github.com/guweigang/vduckdb.git' }}
  VDUCKDB_REF: ${{ vars.VDUCKDB_REF || 'main' }}
  VCLICKHOUSE_REPO: ${{ vars.VCLICKHOUSE_REPO || 'https://github.com/guweigang/vclickhouse.git' }}
  VCLICKHOUSE_REF: ${{ vars.VCLICKHOUSE_REF || 'main' }}
  MONGO_REPO: ${{ vars.MONGO_REPO || 'https://github.com/guweigang/mongo.git' }}
  MONGO_REF: ${{ vars.MONGO_REF || 'main' }}
  VMARKDOWN_REPO: ${{ vars.VMARKDOWN_REPO || 'https://github.com/guweigang/vmarkdown.git' }}
  VMARKDOWN_REF: ${{ vars.VMARKDOWN_REF || 'master' }}
  MONGO_C_DRIVER_VERSION: ${{ vars.MONGO_C_DRIVER_VERSION || '2.4.0' }}
  VTABLE_SIDECAR_V_CC: ${{ vars.VTABLE_SIDECAR_V_CC || 'clang' }}
  VTABLE_SIDECAR_V_FLAGS: ${{ vars.VTABLE_SIDECAR_V_FLAGS || '-show-c-output -d build_quickjs -d use_openssl' }}

jobs:
  linux:
    name: Linux package (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Normalize artifact ref
        id: artifact_ref
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node scripts/ci/normalize-artifact-ref.mjs

      - name: Prepare CNB authentication
        env:
          CNB_ACCESS_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CNB_ACCESS_TOKEN}" ]; then
            git config --global url."https://cnb:${CNB_ACCESS_TOKEN}@cnb.cool/".insteadOf "https://cnb.cool/"
          fi

      - name: Clone source from CNB
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.source_ref }}" "${CNB_SOURCE_REPO}" "${SOURCE_DIR}" || {
            git clone "${CNB_SOURCE_REPO}" "${SOURCE_DIR}"
            cd "${SOURCE_DIR}"
            git checkout "${{ inputs.source_ref }}"
          }

      - name: Apply Linux vjsx shell compatibility
        run: |
          set -euo pipefail
          script="${SOURCE_DIR}/desktop/scripts/prepare-sidecar.sh"
          expected='sh "$VJSX_SOURCE/scripts/build-vjsx.sh"'
          replacement='bash "$VJSX_SOURCE/scripts/build-vjsx.sh"'
          matches="$(grep -F -c "${expected}" "${script}")"
          if [ "${matches}" -ne 2 ]; then
            echo "expected 2 vjsx shell calls in ${script}, found ${matches}" >&2
            exit 1
          fi
          sed -i "s|${expected}|${replacement}|g" "${script}"

      - name: Clone vjsx
        run: |
          set -euo pipefail
          sh scripts/ci/clone-vjsx.sh

      - name: Clone V modules
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${VDUCKDB_REF}" "${VDUCKDB_REPO}" "${VDUCKDB_DIR}"
          git clone --depth 1 --branch "${VCLICKHOUSE_REF}" "${VCLICKHOUSE_REPO}" "${VCLICKHOUSE_DIR}"
          git clone --depth 1 --branch "${MONGO_REF}" "${MONGO_REPO}" "${MONGO_DIR}"
          git clone --depth 1 --branch "${VMARKDOWN_REF}" "${VMARKDOWN_REPO}" "${VMARKDOWN_DIR}"
          mkdir -p "${HOME}/.vmodules/rodabt"
          ln -s "${GITHUB_WORKSPACE}/${VDUCKDB_DIR}" "${HOME}/.vmodules/rodabt/vduckdb"
          ln -s "${GITHUB_WORKSPACE}/${MONGO_DIR}/src" "${HOME}/.vmodules/mongo"
          ln -s "${GITHUB_WORKSPACE}/${VMARKDOWN_DIR}" "${HOME}/.vmodules/vmarkdown"

      - name: Ensure vjsx managed QuickJS source
        run: |
          set -euo pipefail
          quickjs_path="$(QUICKJS_DIR="${GITHUB_WORKSPACE}/${QUICKJS_DIR}" "${GITHUB_WORKSPACE}/${VJSX_DIR}/scripts/ensure-quickjs.sh")"
          echo "VJS_QUICKJS_PATH=${quickjs_path}" >> "${GITHUB_ENV}"

      - name: Install Linux system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            default-libmysqlclient-dev \
            file \
            libayatana-appindicator3-dev \
            libgc-dev \
            libgtk-3-dev \
            libpq-dev \
            libsasl2-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libtesseract-dev \
            libssl-dev \
            libutf8proc-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libzstd-dev \
            patchelf \
            pkg-config \
            wget \
            zlib1g-dev

      - name: Install MongoDB C driver
        run: sh "$GITHUB_WORKSPACE/scripts/ci/linux/install-mongodb.sh"

      - name: Install DuckDB native library
        run: bash scripts/ci/linux/install-duckdb.sh

      - name: Install V
        run: sh "$GITHUB_WORKSPACE/scripts/ci/install-v.sh"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Linux Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/desktop/src-tauri/target
          key: linux-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('source/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/desktop/package-lock.json

      - name: Build and stage native attachment OCR
        working-directory: source
        run: bash "$GITHUB_WORKSPACE/scripts/ci/linux/stage-attachment-ocr.sh"

      - name: Install desktop dependencies
        working-directory: source/desktop
        run: npm ci

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tauri-cli-bin"
          cat > "${RUNNER_TEMP}/tauri-cli-bin/cargo-tauri" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "tauri" ]; then
            shift
          fi
          exec npm exec --yes --package "@tauri-apps/cli@${TAURI_CLI_VERSION:?}" -- tauri "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/tauri-cli-bin/cargo-tauri"
          echo "${RUNNER_TEMP}/tauri-cli-bin" >> "${GITHUB_PATH}"
          actual="$(PATH="${RUNNER_TEMP}/tauri-cli-bin:${PATH}" cargo tauri --version)"
          expected="tauri-cli ${TAURI_CLI_VERSION}"
          if [ "${actual}" != "${expected}" ]; then
            echo "unexpected Tauri CLI version: ${actual}; expected ${expected}" >&2
            exit 1
          fi
          printf '%s\n' "${actual}"

      - name: Show toolchain
        run: |
          set -euo pipefail
          v version
          rustc -vV
          cargo tauri --version
          node --version
          npm --version
          pkg-config --modversion webkit2gtk-4.1
          pkg-config --modversion openssl
          pkg-config --modversion bdw-gc
          pkg-config --modversion mongoc2

      - name: Check desktop and Tauri build inputs
        working-directory: source
        env:
          VTABLE_VJSX_PATH: ${{ github.workspace }}/${{ env.VJSX_DIR }}
          VTABLE_VCLICKHOUSE_PATH: ${{ github.workspace }}/${{ env.VCLICKHOUSE_DIR }}
          VFLAGS: "-cc clang"
        run: |
          set -euo pipefail
          npm --prefix desktop run check
          npm --prefix desktop run sidecar:prepare
          ldd backend/bin/vtable-sidecar > "${RUNNER_TEMP}/sidecar-ldd.txt"
          cat "${RUNNER_TEMP}/sidecar-ldd.txt"
          if grep -q "not found" "${RUNNER_TEMP}/sidecar-ldd.txt"; then
            echo "sidecar has unresolved runtime libraries" >&2
            exit 1
          fi
          backend/bin/vtable-sidecar
          npm --prefix desktop run build
          cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Stage Linux sidecar dependency closure
        run: python3 scripts/ci/linux/stage-sidecar-libraries.py

      - name: Build Linux package
        working-directory: source
        env:
          VTABLE_VJSX_PATH: ${{ github.workspace }}/${{ env.VJSX_DIR }}
          VTABLE_VCLICKHOUSE_PATH: ${{ github.workspace }}/${{ env.VCLICKHOUSE_DIR }}
          VFLAGS: "-cc clang"
        run: |
          set -euo pipefail
          cargo tauri build --bundles appimage,deb

      - name: Preserve Linux package candidate
        uses: actions/upload-artifact@v4
        with:
          name: aidatastudio-linux-candidate-${{ github.run_id }}
          path: |
            source/desktop/src-tauri/target/release/bundle/deb/*.deb
            source/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            source/desktop/native/attachment-ocr/target/release/attachment-normalization-probe
          if-no-files-found: error
          retention-days: 14

      - name: Verify installed Linux OCR runtime
        run: bash scripts/ci/linux/verify-installed-ocr.sh

      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          cp "$RUNNER_TEMP/attachment-ocr-evidence/native-acceptance.json" dist/linux/ocr-native-acceptance.json
          cp source/backend/runtime/attachment-ocr/manifest.json dist/linux/ocr-manifest.json
          cp "$RUNNER_TEMP/attachment-ocr-evidence/installed-"*.json dist/linux/
          find source/desktop/src-tauri/target/release/bundle -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.sig" \) \
            -print -exec cp {} dist/linux/ \;
          (
            cd dist/linux
            sha256sum * > sha256sums.txt
          )
          find dist/linux -maxdepth 1 -type f -print | sort

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidatastudio-linux-${{ steps.artifact_ref.outputs.value }}-x64
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14
